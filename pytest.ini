[pytest]
# Run tests from the repo root so `import src.features` works without installing the package.
pythonpath = .
testpaths = tests
# FastAPI's TestClient still uses httpx, which Starlette now marks as deprecated. It works; hide the notice
# rather than add another package just for tests.
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated
